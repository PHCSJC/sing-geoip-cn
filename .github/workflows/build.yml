name: Build geoip-cn rule-set

on:
  workflow_dispatch:
  schedule:
    # 每周一、周四 03:00 UTC (11:00 Asia/Shanghai)
    - cron: '0 3 * * 1,4'
  push:
    branches: [ main ]
    paths:
      - 'build.py'
      - '.github/workflows/build.yml'

permissions:
  contents: write

concurrency:
  group: build-geoip-cn
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Download sing-box
        env:
          SB_VERSION: '1.14.3'
        run: |
          set -euo pipefail
          URL="https://github.com/SagerNet/sing-box/releases/download/v${SB_VERSION}/sing-box-${SB_VERSION}-linux-amd64.tar.gz"
          curl -fsSL "$URL" -o sb.tar.gz
          tar xzf sb.tar.gz
          mv "sing-box-${SB_VERSION}-linux-amd64/sing-box" ./sing-box
          chmod +x ./sing-box
          ./sing-box version

      - name: Aggregate sources
        run: python3 build.py

      - name: Compile rule-set
        run: |
          set -euo pipefail
          ./sing-box rule-set compile cache/rule-set-src.json -o dist/geoip-cn.srs
          ls -lh dist/

      - name: Verify rule-set
        run: |
          set -euo pipefail
          SRS=dist/geoip-cn.srs

          check_hit() {
            out=$(./sing-box rule-set match --format binary "$SRS" "$1" 2>&1 || true)
            case "$out" in
              *"match rules"*) return 0 ;;
              *) return 1 ;;
            esac
          }

          fail=0

          echo "--- must HIT (China) ---"
          for ip in 119.29.29.29 223.5.5.5 110.242.69.21 1.116.1.1 43.166.192.1; do
            if check_hit "$ip"; then echo "  OK   $ip"; else echo "  FAIL $ip"; fail=1; fi
          done

          echo "--- must MISS (foreign) ---"
          for ip in 8.8.8.8 1.1.1.1 142.251.152.119 20.205.243.166 104.16.124.96; do
            if check_hit "$ip"; then echo "  FAIL $ip should not match"; fail=1; else echo "  OK   $ip"; fi
          done

          # Regression guard: Clang.CN lists these as CN but they are
          # physically abroad (Malakmadze Web LLC, Tele2, etc). Including
          # them routes foreign sites direct. See build.py header.
          echo "--- regression: must MISS (Clang.CN false positives) ---"
          for ip in 162.222.90.70 5.255.61.1 31.222.234.1 77.216.50.1 94.118.188.1; do
            if check_hit "$ip"; then echo "  FAIL $ip regressed (Clang.CN false positive)"; fail=1; else echo "  OK   $ip"; fi
          done

          exit $fail

      - name: Commit and push
        run: |
          set -euo pipefail
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add dist/
          if git diff --cached --quiet; then
            echo "no changes in dist/, nothing to commit"
            exit 0
          fi
          VER=$(cat dist/version)
          git commit -m "Update geoip-cn rule-set ${VER}"
          for i in 1 2 3 4 5; do
            if git push; then
              echo "pushed on attempt $i"
              exit 0
            fi
            echo "push rejected, rebasing onto origin/main (attempt $i)"
            git pull --rebase --autostash origin main || true
            sleep $((i * 3))
          done
          echo "ERROR: push failed after 5 attempts"
          exit 1
